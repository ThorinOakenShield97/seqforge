[project]
name = "seqforge"
version = "0.4.0"
description = "A modern Python toolkit for biological sequence analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ThorinOakenShield97", email = "eguillen.galvez@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "bioinformatics",
    "biology",
    "DNA",
    "FASTA",
    "sequence-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.27.0",
]
[project.urls]
Repository = "https://github.com/ThorinOakenShield97/seqforge"
Issues = "https://github.com/ThorinOakenShield97/seqforge/issues"

[project.scripts]
seqforge = "seqforge.main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

